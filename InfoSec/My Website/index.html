<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Security Solutions</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', Arial, sans-serif;
            background: #0f2027;  /* fallback for old browsers */
            background: linear-gradient(135deg, #2c5364, #203a43, #0f2027);
            color: #fff;
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 48px;
            background: rgba(20, 30, 48, 0.95);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .logo {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #00c3ff;
        }
        .header-buttons button {
            margin-left: 16px;
            padding: 10px 28px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 24px;
            background: linear-gradient(90deg, #00c3ff 0%, #3a7bd5 100%);
            color: #fff;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        .header-buttons button:hover {
            background: linear-gradient(90deg, #3a7bd5 0%, #00c3ff 100%);
            transform: translateY(-2px) scale(1.04);
        }
        main {
            max-width: 900px;
            margin: 60px auto 0 auto;
            padding: 32px;
            background: rgba(44, 83, 100, 0.85);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
        }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 16px;
            color: #00c3ff;
        }
        .services {
            display: flex;
            flex-wrap: wrap;
            gap: 32px;
            justify-content: center;
            margin-top: 32px;
        }
        .service-card {
            background: rgba(32, 58, 67, 0.95);
            border-radius: 18px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.18);
            padding: 32px 24px;
            width: 240px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .service-card:hover {
            transform: translateY(-8px) scale(1.04);
            box-shadow: 0 8px 32px rgba(0,195,255,0.18);
        }
        .service-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #3a7bd5;
        }
        .service-desc {
            font-size: 1rem;
            color: #e0e0e0;
        }
        @media (max-width: 700px) {
            main {
                padding: 16px;
            }
            .services {
                flex-direction: column;
                align-items: center;
            }
        }
        /* Quotes Marquee Styles */
        .quotes-marquee-container {
            width: 100vw;
            overflow: hidden;
            background: rgba(32, 58, 67, 0.92);
            margin: 32px 0 0 0;
            border-top: 2px solid #00c3ff22;
            border-bottom: 2px solid #00c3ff22;
            padding: 40px 0;
            min-height: 340px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .quotes-marquee-wrapper {
            position: relative;
            width: 100%;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 100vw;
        }
        .quote-box {
            width: 420px;
            height: 320px;
            background: linear-gradient(135deg, #00c3ff33 0%, #3a7bd533 100%);
            border-radius: 28px;
            box-shadow: 0 4px 24px rgba(0,195,255,0.13);
            padding: 36px 36px;
            color: #fff;
            font-size: 1.35rem;
            font-style: italic;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            opacity: 1;
            transition: transform 1.2s cubic-bezier(0.77,0,0.175,1), opacity 0.7s;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        .quote-box.hide {
            opacity: 0;
            transform: translate(50vw, -50%);
        }
        .quote-box.show {
            opacity: 1;
            transform: translate(-50%, -50%);
        }
        .quote-box.slide-out {
            opacity: 0;
            transform: translate(-150vw, -50%);
        }
        .quote-box span {
            font-size: 1.1rem;
            color: #00c3ff;
            font-style: normal;
            margin-top: 18px;
        }
        @media (max-width: 700px) {
            .quotes-marquee-container {
                min-height: 180px;
                padding: 16px 0;
            }
            .quotes-marquee-wrapper {
                width: 100vw;
                height: 180px;
            }
            .quote-box {
                width: 90vw;
                height: 180px;
                font-size: 1rem;
                padding: 12px 8px;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
            }
            .quote-box.hide {
                transform: translate(50vw, -50%);
            }
            .quote-box.slide-out {
                transform: translate(-150vw, -50%);
            }
        }
    </header>

    <main>
        <h1>Our Services</h1>
        <div class="services">
            <a href="vapt.html" class="service-card" style="text-decoration:none; color:inherit;">
                <div class="service-title">VAPT</div>
                <div class="service-desc">Vulnerability Assessment & Penetration Testing to identify and mitigate security risks in your systems.</div>
            </a>
            <a href="network-scanning.html" class="service-card" style="text-decoration:none; color:inherit;">
                <div class="service-title">Network Scanning</div>
        .quote-box.hide {
            opacity: 0;
            transform: translate(50vw, -50%);
        }
        .quote-box.show {
            opacity: 1;
            transform: translate(-50%, -50%);
        }
        .quote-box.slide-out {
            opacity: 0;
            transform: translate(-150vw, -50%);
        }
                <div class="service-desc">Thorough audits of your cloud infrastructure to ensure robust security and compliance.</div>
            </a>
        </div>
        <!-- Security Quotes Marquee (static, one at a time, slides every 15s) -->
        <div class="quotes-marquee-container">
            <div class="quotes-marquee-wrapper">
                <div class="quote-box show" id="quote0">"Security is not a product, but a process."<br><span>- Bruce Schneier</span></div>
                <div class="quote-box hide" id="quote1">"The best defense against hackers is a well-informed user."<br><span>- Anonymous</span></div>
                <div class="quote-box hide" id="quote2">"Only amateurs attack machines; professionals target people."<br><span>- Bruce Schneier</span></div>
                <div class="quote-box hide" id="quote3">"Cybersecurity is much more than an IT topic, it’s a business imperative."<br><span>- Stephane Nappo</span></div>
                <div class="quote-box hide" id="quote4">"If you spend more on coffee than on IT security, you will be hacked."<br><span>- Richard Clarke</span></div>
            </div>
        </div>
    </main>
</body>
<script>
let currentQuote = 0;
const totalQuotes = document.querySelectorAll('.quote-box').length;
setInterval(() => {
    const prev = currentQuote;
    const next = (currentQuote + 1) % totalQuotes;
    document.getElementById('quote'+prev).classList.remove('show');
    document.getElementById('quote'+prev).classList.add('slide-out');
    setTimeout(() => {
        document.getElementById('quote'+prev).classList.remove('slide-out');
        document.getElementById('quote'+prev).classList.add('hide');
        document.getElementById('quote'+next).classList.remove('hide');
        document.getElementById('quote'+next).classList.add('show');
    }, 1200);
    currentQuote = next;
}, 15000);
</script>
</html>

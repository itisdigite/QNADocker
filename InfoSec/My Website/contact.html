<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .container {
            max-width: 400px;
            margin: 60px auto;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(60, 60, 120, 0.12);
            padding: 32px 28px 28px 28px;
            position: relative;
            z-index: 1;
        }
        h2 {
            text-align: center;
            margin-bottom: 18px;
            color: #2d3a4b;
        }
        form label {
            display: block;
            margin-bottom: 6px;
            color: #3a4d63;
            font-weight: 500;
        }
        form input, form textarea {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 18px;
            border: 1px solid #b5c6d6;
            border-radius: 7px;
            font-size: 1rem;
            background: #f7fafc;
            transition: border 0.2s;
        }
        form input:focus, form textarea:focus {
            border-color: #6a9ae2;
            outline: none;
        }
        form textarea {
            min-height: 90px;
            resize: vertical;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #6a9ae2 0%, #4f8edc 100%);
            color: #fff;
            border: none;
            border-radius: 7px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: linear-gradient(90deg, #4f8edc 0%, #6a9ae2 100%);
        }
        /* Decorative SVGs */
        .vector-top {
            position: absolute;
            top: -60px;
            left: -60px;
            z-index: 0;
            opacity: 0.5;
        }
        .vector-bottom {
            position: absolute;
            bottom: -60px;
            right: -60px;
            z-index: 0;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <!-- Decorative SVGs -->
    <svg class="vector-top" width="160" height="160" viewBox="0 0 160 160" fill="none">
        <circle cx="80" cy="80" r="80" fill="#6a9ae2" fill-opacity="0.18"/>
        <circle cx="80" cy="80" r="50" fill="#4f8edc" fill-opacity="0.22"/>
    </svg>
    <svg class="vector-bottom" width="160" height="160" viewBox="0 0 160 160" fill="none">
        <rect x="0" y="0" width="160" height="160" rx="80" fill="#e0eafc" fill-opacity="0.25"/>
        <rect x="30" y="30" width="100" height="100" rx="50" fill="#cfdef3" fill-opacity="0.28"/>
    </svg>
    <div class="container">
        <h2>Contact Us</h2>
        <form action="/contact" method="POST">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </div>
</body>
</html>
